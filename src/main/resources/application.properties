spring.application.name=networktraffic

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/networkDB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

anomaly.window-seconds=${ANOMALY_WINDOW_SECONDS:10}
anomaly.cooldown-seconds=${ANOMALY_COOLDOWN_SECONDS:60}
anomaly.traffic-spike.packet-count=${ANOMALY_TRAFFIC_SPIKE_PACKET_COUNT:100}
anomaly.port-scan.unique-ports=${ANOMALY_PORT_SCAN_UNIQUE_PORTS:20}
anomaly.syn-flood.syn-count=${ANOMALY_SYN_FLOOD_SYN_COUNT:50}
anomaly.large-packet.bytes=${ANOMALY_LARGE_PACKET_BYTES:1400}
anomaly.dns-volume.packet-count=${ANOMALY_DNS_VOLUME_PACKET_COUNT:50}
anomaly.allowed-destination-ports=${ANOMALY_ALLOWED_DESTINATION_PORTS:80,443,53,22}

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
springdoc.swagger-ui.path=/swagger-ui.html
